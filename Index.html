<!doctype html>
<html lang="da">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111827">
<title>Hvor ligger det?</title>
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",sans-serif;color:#111827;background:#f3f4f6}
*{box-sizing:border-box}body{margin:0;background:#f3f4f6}button,input{font:inherit}
.top{background:#111827;color:white;padding:calc(16px + env(safe-area-inset-top)) 16px 16px;position:sticky;top:0;z-index:10}
.top h1{margin:0 0 12px;font-size:24px}.search{width:100%;border:0;border-radius:14px;padding:13px 15px;background:#fff;color:#111827}
main{max-width:720px;margin:auto;padding:16px 14px calc(100px + env(safe-area-inset-bottom))}
.card{background:#fff;border-radius:16px;padding:16px;margin-bottom:12px;box-shadow:0 2px 10px #0000000c}
h2{font-size:20px;margin:0 0 12px}.muted{color:#6b7280}.empty{text-align:center;padding:40px 10px;color:#6b7280}
.btn{border:0;border-radius:12px;padding:11px 14px;background:#e5e7eb}.primary{background:#111827;color:white}.danger{background:#fee2e2;color:#991b1b}
.fab{position:fixed;right:18px;bottom:18px;width:60px;height:60px;border:0;border-radius:50%;background:#111827;color:#fff;font-size:30px;z-index:20;box-shadow:0 6px 20px #0004}
.path{color:#4b5563;font-size:14px;margin-top:7px}.name{font-weight:700;font-size:18px}
.row{display:flex;gap:8px;flex-wrap:wrap}.row .btn{flex:1;min-width:100px}
label{display:block;font-weight:600;font-size:14px;margin:12px 0 6px}input{width:100%;padding:12px;border:1px solid #d1d5db;border-radius:11px;background:#fff}
.level{display:flex;align-items:center;gap:8px;padding:13px;border-radius:12px;background:#f9fafb;margin:7px 0}.level .arrow{color:#9ca3af}
.level button{margin-left:auto}.crumbs{font-size:14px;color:#6b7280;margin-bottom:12px}
.hidden{display:none!important}.small{font-size:12px;color:#6b7280}
</style>
</head>
<body>
<header class="top">
<h1>📦 Hvor ligger det?</h1>
<input id="search" class="search" placeholder="🔎 Søg efter ting eller placering">
</header>

<main>
<section id="locationsView"></section>
<section id="itemsView"></section>

<section id="itemForm" class="card hidden">
<h2 id="formTitle">Tilføj ting</h2>
<label>Navn</label><input id="itemName" placeholder="Fx boremaskine">
<label>Kategori</label><input id="itemCategory" placeholder="Fx værktøj">
<label>Antal</label><input id="itemQty" type="number" min="1" value="1">
<label>Note</label><input id="itemNote" placeholder="Fx blå Makita">
<div class="row" style="margin-top:14px">
<button class="btn primary" onclick="saveItem()">Gem ting</button>
<button class="btn" onclick="hideForms()">Annuller</button>
</div>
</section>

<section id="locationForm" class="card hidden">
<h2>➕ Ny placering</h2>
<div class="small">Den nye placering bliver oprettet inde i den placering, du står i.</div>
<label>Navn</label><input id="locationName" placeholder="Fx Garage, Reol 2 eller Kasse B">
<div class="row" style="margin-top:14px">
<button class="btn primary" onclick="saveLocation()">Gem placering</button>
<button class="btn" onclick="hideForms()">Annuller</button>
</div>
</section>
</main>

<button class="fab" onclick="showItemForm()">+</button>

<script>
const DB="hld_v2";
let db=JSON.parse(localStorage.getItem(DB)||'{"locations":[{"id":"root","name":"Mit hjem","parentId":null}],"items":[]}');
let current="root",editing=null;

function persist(){localStorage.setItem(DB,JSON.stringify(db));render()}
function esc(v){return String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function loc(id){return db.locations.find(x=>x.id===id)}
function children(id){return db.locations.filter(x=>x.parentId===id)}
function path(id){let a=[],x=loc(id);while(x){a.unshift(x.name);x=loc(x.parentId)}return a}
function hideForms(){document.querySelectorAll(".hidden").forEach(()=>{});$("itemForm").classList.add("hidden");$("locationForm").classList.add("hidden");editing=null}
function $(id){return document.getElementById(id)}

function render(){
 const q=$("search").value.toLowerCase().trim();
 const here=loc(current)||db.locations[0];
 let html=`<div class="card"><div class="crumbs">📍 ${path(current).map(esc).join(" → ")}</div>
 <div class="row"><button class="btn" onclick="goParent()">⬆️ Tilbage</button><button class="btn primary" onclick="showLocationForm()">＋ Placering</button></div></div>`;
 const kids=children(current);
 if(kids.length){
  html+=kids.map(x=>`<div class="card level" onclick="openLocation('${x.id}')"><span>📁</span><b>${esc(x.name)}</b><span class="arrow">›</span></div>`).join("");
 }
 $("locationsView").innerHTML=html;

 let its=db.items.filter(x=>x.locationId===current);
 if(q){
   its=db.items.filter(x=>(x.name+" "+x.category+" "+x.note+" "+path(x.locationId).join(" ")).toLowerCase().includes(q));
 }
 if(its.length){
   $("itemsView").innerHTML=`<h2 style="margin:18px 2px 10px">${q?"🔎 Resultater":"📦 Ting her"}</h2>`+
   its.map(x=>`<div class="card"><div class="name">📦 ${esc(x.name)}</div>
   <div class="path">📍 ${path(x.locationId).map(esc).join(" → ")}</div>
   ${x.category?`<div class="small">Kategori: ${esc(x.category)}</div>`:""}
   <div class="small">Antal: ${x.qty}</div>${x.note?`<div class="small">📝 ${esc(x.note)}</div>`:""}
   <div class="row" style="margin-top:10px"><button class="btn" onclick="editItem('${x.id}')">Redigér</button><button class="btn danger" onclick="deleteItem('${x.id}')">Slet</button></div></div>`).join("");
 }else if(!q && !db.items.filter(x=>x.locationId===current).length){
   $("itemsView").innerHTML=`<div class="empty">Ingen ting her endnu.<br>Tryk <b>＋</b> for at tilføje en ting.</div>`;
 }else if(q){$("itemsView").innerHTML=`<div class="empty">Ingen resultater.</div>`}
}

function openLocation(id){current=id;hideForms();render();window.scrollTo({top:0,behavior:"smooth"})}
function goParent(){let p=loc(current)?.parentId;if(p){openLocation(p)}}
function showLocationForm(){hideForms();$("locationForm").classList.remove("hidden");$("locationName").value="";$("locationName").focus()}
function saveLocation(){
 let n=$("locationName").value.trim();if(!n){alert("Skriv et navn.");return}
 db.locations.push({id:crypto.randomUUID(),name:n,parentId:current});persist();hideForms()
}
function showItemForm(item=null){
 hideForms();editing=item?.id||null;$("itemForm").classList.remove("hidden");
 $("formTitle").textContent=item?"Redigér ting":"Tilføj ting";
 $("itemName").value=item?.name||"";$("itemCategory").value=item?.category||"";
 $("itemQty").value=item?.qty||1;$("itemNote").value=item?.note||"";$("itemName").focus()
}
function saveItem(){
 let name=$("itemName").value.trim();if(!name){alert("Skriv et navn.");return}
 let data={id:editing||crypto.randomUUID(),name,category:$("itemCategory").value.trim(),qty:Math.max(1,Number($("itemQty").value)||1),note:$("itemNote").value.trim(),locationId:editing?db.items.find(x=>x.id===editing).locationId:current};
 let i=db.items.findIndex(x=>x.id===data.id);if(i<0)db.items.push(data);else db.items[i]=data;
 persist();hideForms()
}
function editItem(id){let x=db.items.find(x=>x.id===id);if(x)showItemForm(x)}
function deleteItem(id){if(confirm("Slet denne ting?")){db.items=db.items.filter(x=>x.id!==id);persist()}}
$("search").addEventListener("input",render);render();
</script>
</body>
</html>
