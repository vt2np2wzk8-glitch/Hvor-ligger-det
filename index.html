<!DOCTYPE html>
<html lang="da">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2f7d5b">
<title>Hvor ligger det?</title>
<style>
:root{--bg:#f3f7f4;--card:#fff;--text:#183027;--muted:#6c7b75;--primary:#2f7d5b;--soft:#e2f0e9;--danger:#c84b4b;--border:#dce7e1;--shadow:0 8px 24px rgba(28,55,43,.08)}
@media(prefers-color-scheme:dark){:root{--bg:#101714;--card:#19231f;--text:#eef7f2;--muted:#9eafa7;--primary:#55ad82;--soft:#20392e;--danger:#ed6c6c;--border:#2c3b35;--shadow:0 8px 24px rgba(0,0,0,.25)}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",sans-serif}
button,input,select,textarea{font:inherit}button{cursor:pointer}.app{max-width:720px;margin:auto;padding:env(safe-area-inset-top) 16px calc(28px + env(safe-area-inset-bottom))}
header{padding:22px 2px 14px;position:sticky;top:0;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(14px);z-index:10}
.brand{display:flex;align-items:center;gap:11px}.logo{width:43px;height:43px;border-radius:14px;background:linear-gradient(135deg,var(--primary),#6bbf94);display:grid;place-items:center;color:white;font-size:23px;box-shadow:0 6px 15px rgba(47,125,91,.25)}
h1{font-size:24px;margin:0;font-weight:800;letter-spacing:-.5px}.subtitle{font-size:12px;color:var(--muted);margin-top:2px}
.search{margin-top:15px;position:relative}.search input{width:100%;padding:14px 16px 14px 43px;border:1px solid var(--border);border-radius:16px;background:var(--card);color:var(--text);outline:none;box-shadow:var(--shadow)}.search span{position:absolute;left:15px;top:12px;font-size:20px}
.crumb{display:flex;align-items:center;gap:6px;overflow:auto;white-space:nowrap;margin:14px 0 10px;color:var(--muted);font-size:13px}.crumb button{border:0;background:none;color:var(--primary);padding:4px 0;font-weight:700}
.toolbar{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap}.btn{border:0;border-radius:13px;padding:11px 13px;background:var(--card);color:var(--text);border:1px solid var(--border);box-shadow:0 3px 10px rgba(0,0,0,.04);font-weight:700}.btn.primary{background:var(--primary);color:white;border-color:var(--primary)}.btn.danger{color:var(--danger)}.btn.small{padding:8px 10px;font-size:13px}
.section-title{font-size:14px;font-weight:800;color:var(--muted);margin:18px 3px 8px;text-transform:uppercase;letter-spacing:.5px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.loc{background:var(--card);border:1px solid var(--border);border-radius:18px;padding:15px;min-height:105px;box-shadow:var(--shadow);display:flex;flex-direction:column;justify-content:space-between;text-align:left}.loc .folder{font-size:30px}.loc .name{font-weight:800;line-height:1.2;margin-top:8px}.loc .count{font-size:12px;color:var(--muted);margin-top:4px}
.items{display:flex;flex-direction:column;gap:10px}.item{background:var(--card);border:1px solid var(--border);border-radius:18px;padding:11px;display:flex;gap:12px;align-items:center;box-shadow:var(--shadow)}
.thumb{width:68px;height:68px;border-radius:14px;background:var(--soft);display:grid;place-items:center;overflow:hidden;flex:none}.thumb img{width:100%;height:100%;object-fit:cover}.thumb span{font-size:27px}.item-main{min-width:0;flex:1}.item-name{font-weight:800;font-size:16px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.meta,.note{font-size:12px;color:var(--muted);margin-top:4px}.note{line-height:1.3}.actions{display:flex;gap:6px;flex-wrap:wrap;margin-top:9px}.empty{padding:30px 15px;text-align:center;color:var(--muted);background:var(--card);border:1px dashed var(--border);border-radius:18px}
.fab{position:fixed;right:18px;bottom:calc(18px + env(safe-area-inset-bottom));width:58px;height:58px;border:0;border-radius:20px;background:var(--primary);color:#fff;font-size:30px;box-shadow:0 10px 25px rgba(47,125,91,.32);z-index:20}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:flex-end;justify-content:center;z-index:50}.modal.show{display:flex}.sheet{width:100%;max-width:720px;background:var(--card);color:var(--text);border-radius:25px 25px 0 0;padding:20px 17px calc(20px + env(safe-area-inset-bottom));max-height:90vh;overflow:auto}.handle{width:42px;height:5px;border-radius:5px;background:var(--border);margin:0 auto 17px}.sheet h2{margin:0 0 15px;font-size:21px}.field{margin:12px 0}.field label{display:block;font-size:13px;font-weight:800;margin-bottom:6px;color:var(--muted)}.field input,.field select,.field textarea{width:100%;border:1px solid var(--border);border-radius:13px;background:var(--bg);color:var(--text);padding:12px;outline:none}.field textarea{min-height:85px;resize:vertical}.preview{width:100%;max-height:190px;object-fit:cover;border-radius:15px;margin-top:8px}.modal-actions{display:flex;gap:8px;margin-top:18px}.modal-actions>*{flex:1}.path{font-size:12px;color:var(--primary);margin-top:3px}.hidden{display:none!important}
@media(min-width:560px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
</style>
</head>
<body>
<div class="app">
<header><div class="brand"><div class="logo">📍</div><div><h1>Hvor ligger det?</h1><div class="subtitle">Find dine ting på få sekunder</div></div></div>
<div class="search"><span>🔎</span><input id="search" placeholder="Søg efter en ting eller lokation..." oninput="render()"></div></header>
<main id="content"></main></div>
<button class="fab" onclick="openItem()">＋</button>
<div class="modal" id="modal"><div class="sheet"><div class="handle"></div><h2 id="modalTitle">Tilføj</h2><div id="form"></div></div></div>

<script>
const K="hld_v2";
let db;try{db=JSON.parse(localStorage.getItem(K)||"")}catch(e){db=null}
if(!db||!Array.isArray(db.locations)||!Array.isArray(db.items))db={locations:[{id:"root",name:"Mit hjem",parentId:null}],items:[]};
if(!db.locations.some(x=>x.id==="root"))db.locations.unshift({id:"root",name:"Mit hjem",parentId:null});
let currentId="root",editingItemId=null,editingLocId=null,pendingImage=null;
function save(){localStorage.setItem(K,JSON.stringify(db))}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,8)}
function loc(id){return db.locations.find(x=>x.id===id)}
function children(id){return db.locations.filter(x=>x.parentId===id)}
function pathIds(id){let a=[],x=loc(id);while(x){a.unshift(x.id);x=loc(x.parentId)}return a}
function pathName(id){return pathIds(id).map(x=>loc(x)?.name).filter(Boolean).join(" → ")}
function esc(s){return String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]))}
function closeModal(){document.getElementById("modal").classList.remove("show");editingItemId=editingLocId=null;pendingImage=null}
function openModal(title,body){document.getElementById("modalTitle").textContent=title;document.getElementById("form").innerHTML=body;document.getElementById("modal").classList.add("show")}
function go(id){currentId=id;render()}function back(){let x=loc(currentId);if(x?.parentId)go(x.parentId)}
function render(){
 const q=document.getElementById("search").value.trim().toLowerCase(),c=document.getElementById("content");
 if(q){renderSearch(c,q);return}
 const l=loc(currentId)||loc("root"),ids=pathIds(l.id);
 let html='<div class="crumb">';ids.forEach((id,i)=>{html+=(i?"<span>›</span>":"")+`<button onclick="go('${id}')">${esc(loc(id).name)}</button>`});html+="</div>";
 html+=`<div class="toolbar">${l.parentId?'<button class="btn" onclick="back()">← Tilbage</button>':""}<button class="btn primary" onclick="openLocation()">＋ Lokation</button>${l.id!=="root"?`<button class="btn small" onclick="renameLocation('${l.id}')">✏️ Omdøb</button><button class="btn small danger" onclick="deleteLocation('${l.id}')">🗑️</button>`:""}</div>`;
 const ch=children(l.id),its=db.items.filter(x=>x.locationId===l.id);
 if(ch.length){html+='<div class="section-title">Lokationer</div><div class="grid">';ch.forEach(x=>{let count=db.items.filter(i=>i.locationId===x.id).length;html+=`<button class="loc" onclick="go('${x.id}')"><div class="folder">📁</div><div class="name">${esc(x.name)}</div><div class="count">${count} ${count===1?"ting":"ting"}</div></button>`});html+="</div>"}
 if(its.length){html+='<div class="section-title">Ting her</div><div class="items">';its.forEach(x=>html+=itemHtml(x));html+="</div>"}
 if(!ch.length&&!its.length)html+='<div class="empty">📦<br><br>Denne lokation er tom.<br>Tryk på <b>＋ Lokation</b> eller <b>＋</b> for at komme i gang.</div>';
 c.innerHTML=html;
}
function itemHtml(x){return `<div class="item"><div class="thumb">${x.image?`<img src="${x.image}" alt="">`:"<span>📦</span>"}</div><div class="item-main"><div class="item-name">${esc(x.name)}</div><div class="meta">${x.cat?esc(x.cat)+" · ":""}Antal: ${esc(x.qty||1)}</div>${x.note?`<div class="note">${esc(x.note)}</div>`:""}<div class="actions"><button class="btn small" onclick="openItem('${x.id}')">✏️ Rediger</button><button class="btn small" onclick="moveItem('${x.id}')">↗️ Flyt</button><button class="btn small danger" onclick="deleteItem('${x.id}')">🗑️</button></div></div></div>`}
function renderSearch(c,q){let r=db.items.filter(x=>(x.name+" "+(x.cat||"")+" "+(x.note||"")+" "+pathName(x.locationId)).toLowerCase().includes(q));c.innerHTML='<div class="crumb"><button onclick="go(currentId)">← Tilbage</button></div><div class="section-title">Søgeresultater · '+r.length+'</div>'+(r.length?'<div class="items">'+r.map(itemSearch).join("")+'</div>`:'<div class="empty">🔎<br><br>Ingen resultater for <b>'+esc(q)+'</b>.</div>');}
function itemSearch(x){return `<div class="item"><div class="thumb">${x.image?`<img src="${x.image}" alt="">`:"<span>📦</span>"}</div><div class="item-main"><div class="item-name">${esc(x.name)}</div><div class="path">📍 ${esc(pathName(x.locationId))}</div><div class="meta">${x.cat?esc(x.cat)+" · ":""}Antal: ${esc(x.qty||1)}</div><div class="actions"><button class="btn small" onclick="go('${x.locationId}')">Åbn</button><button class="btn small" onclick="openItem('${x.id}')">✏️</button><button class="btn small" onclick="moveItem('${x.id}')">↗️ Flyt</button></div></div></div>`}
function openLocation(id=null){editingLocId=id;openModal(id?"Omdøb lokation":"Ny lokation",`<div class="field"><label>Navn</label><input id="locName" value="${id?esc(loc(id).name):""}" placeholder="Fx Reol 2"></div><div class="modal-actions"><button class="btn" onclick="closeModal()">Annuller</button><button class="btn primary" onclick="saveLocation()">Gem</button></div>`);setTimeout(()=>document.getElementById("locName").focus(),50)}
function renameLocation(id){openLocation(id)}
function saveLocation(){let name=document.getElementById("locName").value.trim();if(!name)return alert("Skriv et navn.");if(editingLocId)loc(editingLocId).name=name;else db.locations.push({id:uid(),name,parentId:currentId});save();closeModal();render()}
function deleteLocation(id){if(children(id).length||db.items.some(x=>x.locationId===id)){alert("Lokationen skal være tom, før den kan slettes.");return}let p=loc(id).parentId;db.locations=db.locations.filter(x=>x.id!==id);save();go(p||"root")}
function locationOptions(selected){return db.locations.map(x=>`<option value="${x.id}" ${x.id===selected?"selected":""}>${esc(pathName(x.id))}</option>`).join("")}
function openItem(id=null){editingItemId=id||null;let x=id?db.items.find(i=>i.id===id):null;pendingImage=x?.image||null;openModal(id?"Rediger ting":"Tilføj ting",`<div class="field"><label>Navn</label><input id="iname" value="${esc(x?.name||"")}" placeholder="Fx Boremaskine"></div><div class="field"><label>Kategori</label><input id="icat" value="${esc(x?.cat||"")}" placeholder="Fx Værktøj"></div><div class="field"><label>Antal</label><input id="iqty" type="number" min="1" value="${esc(x?.qty||1)}"></div><div class="field"><label>Lokation</label><select id="iloc">${locationOptions(x?.locationId||currentId)}</select></div><div class="field"><label>Billede</label><input id="photo" type="file" accept="image/*" capture="environment" onchange="readImage(this)">${x?.image?`<img id="preview" class="preview" src="${x.image}">`:'<img id="preview" class="preview hidden">'}</div><div class="field"><label>Noter</label><textarea id="inote" placeholder="Fx ligger i den blå kasse">${esc(x?.note||"")}</textarea></div><div class="modal-actions"><button class="btn" onclick="closeModal()">Annuller</button><button class="btn primary" onclick="saveItem()">Gem</button></div>`)}
function readImage(input){let f=input.files?.[0];if(!f)return;let r=new FileReader();r.onload=e=>{let im=new Image();im.onload=()=>{let max=900,w=im.width,h=im.height;if(w>max||h>max){if(w>h){h=Math.round(h*max/w);w=max}else{w=Math.round(w*max/h);h=max}}let cv=document.createElement("canvas");cv.width=w;cv.height=h;cv.getContext("2d").drawImage(im,0,0,w,h);pendingImage=cv.toDataURL("image/jpeg",.72);let p=document.getElementById("preview");p.src=pendingImage;p.classList.remove("hidden")};im.src=e.target.result};r.readAsDataURL(f)}
function saveItem(){let name=document.getElementById("iname").value.trim();if(!name)return alert("Skriv et navn.");let d={name,cat:document.getElementById("icat").value.trim(),qty:Math.max(1,parseInt(document.getElementById("iqty").value)||1),locationId:document.getElementById("iloc").value,image:pendingImage||null,note:document.getElementById("inote").value.trim()};if(editingItemId)Object.assign(db.items.find(x=>x.id===editingItemId),d);else db.items.push({id:uid(),...d});save();closeModal();render()}
function moveItem(id){let x=db.items.find(i=>i.id===id);openModal("Flyt ting",`<div class="field"><label>Ny lokation</label><select id="moveLoc">${locationOptions(x.locationId)}</select></div><div class="modal-actions"><button class="btn" onclick="closeModal()">Annuller</button><button class="btn primary" onclick="saveMove('${id}')">Flyt</button></div>`)}
function saveMove(id){let x=db.items.find(i=>i.id===id);if(x)x.locationId=document.getElementById("moveLoc").value;save();closeModal();render()}
function deleteItem(id){if(!confirm("Vil du slette denne ting?"))return;db.items=db.items.filter(x=>x.id!==id);save();render()}
render();
</script>
</body>
</html>
