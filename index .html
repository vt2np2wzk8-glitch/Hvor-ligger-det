<!doctype html><html lang="da"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#111827"><title>Hvor ligger det?</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f3f4f6;color:#111827;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,input,select{font:inherit}.top{background:#111827;color:white;padding:calc(16px + env(safe-area-inset-top)) 16px 16px;position:sticky;top:0;z-index:5}.top h1{margin:0 0 12px;font-size:24px}.search{width:100%;padding:13px;border:0;border-radius:13px}main{max-width:720px;margin:auto;padding:16px 14px 100px}.card{background:white;border-radius:16px;padding:16px;margin-bottom:12px;box-shadow:0 2px 10px #0001}.row{display:flex;gap:8px;flex-wrap:wrap}.btn{border:0;border-radius:11px;padding:11px 13px;background:#e5e7eb}.primary{background:#111827;color:white}.danger{background:#fee2e2;color:#991b1b}.fab{position:fixed;right:18px;bottom:18px;width:60px;height:60px;border:0;border-radius:50%;background:#111827;color:white;font-size:30px;z-index:10}.name{font-size:18px;font-weight:700}.path{font-size:14px;color:#4b5563;margin:7px 0}.small{font-size:12px;color:#6b7280;margin:4px 0}.level{padding:14px;border-radius:12px;background:#f9fafb;margin:7px 0;display:flex;gap:8px;align-items:center}.level span:last-child{margin-left:auto}.empty{text-align:center;color:#6b7280;padding:35px 10px}h2{font-size:20px}label{display:block;font-weight:600;font-size:14px;margin:12px 0 6px}input,select{width:100%;padding:12px;border:1px solid #d1d5db;border-radius:10px;background:white}.hidden{display:none}.thumb{width:90px;height:90px;object-fit:cover;border-radius:12px;float:right;margin-left:12px}.clear{clear:both}
</style></head><body>
<header class="top"><h1>📦 Hvor ligger det?</h1><input id="search" class="search" placeholder="🔎 Søg efter ting eller placering"></header><main>
<section id="locations"></section><section id="items"></section>
<section id="itemForm" class="card hidden"><h2 id="itemTitle">➕ Tilføj ting</h2><input type="hidden" id="editId">
<label>Navn</label><input id="name" placeholder="Fx boremaskine"><label>Kategori</label><input id="cat" placeholder="Fx værktøj"><label>Antal</label><input id="qty" type="number" min="1" value="1"><label>Billede</label><input id="photo" type="file" accept="image/*" capture="environment"><div id="preview"></div><label>Note</label><input id="note" placeholder="Fx blå Makita"><div class="row" style="margin-top:14px"><button class="btn primary" onclick="saveItem()">Gem</button><button class="btn" onclick="hide()">Annuller</button></div></section>
<section id="locForm" class="card hidden"><h2 id="locTitle">➕ Ny placering</h2><input type="hidden" id="locEdit"><label>Navn</label><input id="locName" placeholder="Fx Garage, Reol 2 eller Kasse B"><div class="row" style="margin-top:14px"><button class="btn primary" onclick="saveLoc()">Gem</button><button class="btn" onclick="hide()">Annuller</button></div></section>
</main><button class="fab" onclick="addItem()">+</button>
<script>
const K="hld_v2";let db=JSON.parse(localStorage.getItem(K)||'{"locations":[{"id":"root","name":"Mit hjem","parentId":null}],"items":[]}');db.locations??=[{id:"root",name:"Mit hjem",parentId:null}];db.items??=[];let current="root",editing=null,locEditing=null;
const $=x=>document.getElementById(x),esc=x=>String(x??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function save(){localStorage.setItem(K,JSON.stringify(db));render()}function L(id){return db.locations.find(x=>x.id===id)}function kids(id){return db.locations.filter(x=>x.parentId===id)}function path(id){let a=[],x=L(id);while(x){a.unshift(x.name);x=L(x.parentId)}return a}function hide(){$("itemForm").classList.add("hidden");$("locForm").classList.add("hidden");editing=null;locEditing=null}
function render(){if(!L(current))current="root";let h=`<div class="card"><div class="path">📍 ${path(current).map(esc).join(" → ")}</div><div class="row"><button class="btn" onclick="parentLoc()">⬆️ Tilbage</button><button class="btn primary" onclick="addLoc()">＋ Placering</button>${current!="root"?`<button class="btn" onclick="editLoc('${current}')">✏️ Redigér</button><button class="btn danger" onclick="delLoc('${current}')">🗑️ Slet</button>`:""}</div></div>`;h+=kids(current).map(x=>`<div class="card level" onclick="openLoc('${x.id}')">📁 <b>${esc(x.name)}</b><span>›</span></div>`).join("");$("locations").innerHTML=h;
let q=$("search").value.toLowerCase().trim(),a=q?db.items.filter(x=>(x.name+" "+x.cat+" "+x.note+" "+path(x.locationId).join(" ")).toLowerCase().includes(q)):db.items.filter(x=>x.locationId===current);$("items").innerHTML=(a.length?`<h2>${q?"🔎 Resultater":"📦 Ting her"}</h2>`:"")+a.map(x=>`<div class="card">${x.image?`<img class="thumb" src="${x.image}">`:""}<div class="name">📦 ${esc(x.name)}</div><div class="path">📍 ${path(x.locationId).map(esc).join(" → ")}</div>${x.cat?`<div class="small">Kategori: ${esc(x.cat)}</div>`:""}<div class="small">Antal: ${x.qty}</div>${x.note?`<div class="small">📝 ${esc(x.note)}</div>`:""}<div class="row" style="margin-top:10px"><button class="btn" onclick="editItem('${x.id}')">Redigér</button><button class="btn" onclick="move('${x.id}')">📍 Flyt</button><button class="btn danger" onclick="delItem('${x.id}')">Slet</button></div><div class="clear"></div></div>`).join("")+(a.length||q?"":`<div class="empty">Ingen ting her endnu.<br>Tryk + for at tilføje.</div>`)+(q&&!a.length?`<div class="empty">Ingen resultater.</div>`:"")}
function openLoc(id){current=id;hide();render();scrollTo(0,0)}function parentLoc(){let p=L(current)?.parentId;if(p)openLoc(p)}
function addLoc(id=null){hide();locEditing=id;$("locForm").classList.remove("hidden");$("locTitle").textContent=id?"✏️ Redigér placering":"➕ Ny placering";$("locName").value=id?L(id).name:"";$("locName").focus()}function editLoc(id){addLoc(id)}
function saveLoc(){let n=$("locName").value.trim();if(!n)return alert("Skriv et navn.");if(locEditing)L(locEditing).name=n;else db.locations.push({id:crypto.randomUUID(),name:n,parentId:current});save();hide()}
function delLoc(id){if(kids(id).length||db.items.some(x=>x.locationId===id))return alert("Flyt eller slet først alt indhold i denne placering.");if(confirm("Slet placeringen?")){let p=L(id).parentId;db.locations=db.locations.filter(x=>x.id!==id);current=p;save()}}
function addItem(x=null){hide();editing=x?.id||null;$("itemForm").classList.remove("hidden");$("itemTitle").textContent=x?"✏️ Redigér ting":"➕ Tilføj ting";$("name").value=x?.name||"";$("cat").value=x?.cat||"";$("qty").value=x?.qty||1;$("note").value=x?.note||"";$("photo").value="";$("preview").innerHTML=x?.image?`<img class="thumb" src="${x.image}"><div class="clear"></div>`:"";$("name").focus()}
function editItem(id){addItem(db.items.find(x=>x.id===id))}
function img(file){return new Promise((res,rej)=>{let r=new FileReader();r.onload=e=>{let i=new Image();i.onload=()=>{let s=Math.min(1,900/Math.max(i.width,i.height)),c=document.createElement("canvas");c.width=i.width*s;c.height=i.height*s;c.getContext("2d").drawImage(i,0,0,c.width,c.height);res(c.toDataURL("image/jpeg",.72))};i.src=e.target.result};r.onerror=rej;r.readAsDataURL(file)})}
async function saveItem(){let n=$("name").value.trim();if(!n)return alert("Skriv et navn.");let old=editing&&db.items.find(x=>x.id===editing),im=old?.image||"";if($("photo").files[0])im=await img($("photo").files[0]);let x={id:editing||crypto.randomUUID(),name:n,cat:$("cat").value.trim(),qty:Math.max(1,+$("qty").value||1),note:$("note").value.trim(),image:im,locationId:old?.locationId||current};let i=db.items.findIndex(y=>y.id===x.id);i<0?db.items.push(x):db.items[i]=x;try{save();hide()}catch(e){alert("Billedet kunne ikke gemmes. Prøv et mindre billede.")}}
function move(id){let x=db.items.find(y=>y.id===id);let names=db.locations.map(y=>path(y.id).join(" → ")).join("\n");let c=prompt("Skriv hele placeringen, fx Mit hjem → Garage → Reol 2\n\n"+names,path(x.locationId).join(" → "));if(!c)return;let t=db.locations.find(y=>path(y.id).join(" → ").toLowerCase()===c.trim().toLowerCase());if(!t)return alert("Placeringen blev ikke fundet.");x.locationId=t.id;save()}
function delItem(id){if(confirm("Slet denne ting?")){db.items=db.items.filter(x=>x.id!==id);save()}}$("search").addEventListener("input",render);render();
</script></body></html>
